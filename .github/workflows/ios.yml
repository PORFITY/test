name: iOS

on:
  push:
    branches: ['claude/**', main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  core-tests:
    name: MealCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/MealCore
        run: swift test 2>&1 | tail -60

  app:
    name: Build app + simulator smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project (verifies project.yml)
        working-directory: ios/MealPlanner
        run: |
          xcodegen generate
          git diff --stat -- MealPlanner.xcodeproj || true
      - name: Build for iOS Simulator
        working-directory: ios/MealPlanner
        run: |
          set -o pipefail
          xcodebuild -project MealPlanner.xcodeproj -scheme MealPlanner -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling.*Store" | head -80
      - name: Launch in simulator and take screenshots
        working-directory: ios/MealPlanner
        run: |
          APP=$(find build -name "MealPlanner.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "APP=$APP"
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl location "$DEVICE" set 55.7558,37.6173
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location com.example.mealplanner || true
          xcrun simctl launch "$DEVICE" com.example.mealplanner
          sleep 8
          mkdir -p ../../artifacts
          xcrun simctl io "$DEVICE" screenshot ../../artifacts/01-launch.png
          xcrun simctl spawn "$DEVICE" log show --last 1m --predicate 'process == "MealPlanner"' --style compact | tail -40 > ../../artifacts/app-log.txt || true
      - name: Build unsigned IPA (for re-signing with AltStore/Sideloadly or Xcode)
        working-directory: ios/MealPlanner
        run: |
          set -o pipefail
          xcodebuild -project MealPlanner.xcodeproj -scheme MealPlanner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E "error:|BUILD" | head -40
          APP=$(find build-device -name "MealPlanner.app" -path "*Release-iphoneos*" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../../artifacts/MealPlanner-unsigned.ipa Payload
          ls -la ../../artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-artifacts
          path: artifacts/
