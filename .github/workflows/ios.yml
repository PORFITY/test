name: iOS

on:
  push:
    branches: ['claude/**', main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  core-tests:
    name: MealCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/MealCore
        run: swift test 2>&1 | tail -60

  app:
    name: Build app + simulator smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project (verifies project.yml)
        working-directory: ios/MealPlanner
        run: |
          xcodegen generate
          git diff --stat -- MealPlanner.xcodeproj || true
      - name: Build for iOS Simulator
        working-directory: ios/MealPlanner
        run: |
          set -o pipefail
          xcodebuild -project MealPlanner.xcodeproj -scheme MealPlanner -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling.*Store" | head -80
      - name: UI test in simulator (full wizard flow -> plan -> shopping -> assistant)
        timeout-minutes: 25
        working-directory: ios/MealPlanner
        run: |
          mkdir -p ../../artifacts /tmp/ui-shots
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "DEVICE=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl location "$DEVICE" set 55.7558,37.6173 || true
          set +e
          xcodebuild -project MealPlanner.xcodeproj -scheme MealPlanner -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build \
            -resultBundlePath ../../artifacts/ui-tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../../artifacts/ui-test.log | grep -E "error:|Test Case|Test Suite|TEST|failed|passed" | tail -40
          RC=${PIPESTATUS[0]}
          cp -R /tmp/ui-shots ../../artifacts/ui-shots 2>/dev/null || true
          exit $RC
      - name: Build unsigned IPA (for re-signing with AltStore/Sideloadly or Xcode)
        working-directory: ios/MealPlanner
        run: |
          set -o pipefail
          xcodebuild -project MealPlanner.xcodeproj -scheme MealPlanner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E "error:|BUILD" | head -40
          APP=$(find build-device -name "MealPlanner.app" -path "*Release-iphoneos*" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../../artifacts/MealPlanner-unsigned.ipa Payload
          ls -la ../../artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-artifacts
          path: artifacts/
