name: MealPlanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # впишите свой Team ID для установки на устройство
    CODE_SIGN_STYLE: Automatic
packages:
  MealCore:
    path: ../MealCore
targets:
  MealPlanner:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Services
      - path: Design
      - path: Views
      - path: Resources
    dependencies:
      - package: MealCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Рацион
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Геопозиция нужна, чтобы найти продуктовые магазины рядом с вами. Постоянный доступ не требуется — позицию можно не давать и выбрать адрес вручную."
        ITSAppUsesNonExemptEncryption: false
        BackendBaseURL: "$(BACKEND_URL)"
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mealplanner
        BACKEND_URL: ""             # например https:/$()/api.example.com (без пробелов); пусто — работать без backend
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  MealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MealPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mealplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MealPlanner:
    build:
      targets:
        MealPlanner: all
    test:
      targets:
        - MealPlannerUITests
